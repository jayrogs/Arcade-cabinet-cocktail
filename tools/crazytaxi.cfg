# Crazy Taxi (NAOMI). Flycast reads the steering from the analog stick and the pedals from
# the analog triggers; the cabinet's sticks are plain up/down/left/right, so:
#   stick left/right  -> the steering (full lock either way)
#   button 1          -> accelerator (R2), button 2 -> brake (L2)
#   button 3 / 4      -> drive gear / reverse gear (the game's own up/down)
#   stick up / down   -> nothing: steering hard knocked the stick up or down and flipped
#                        the gear, so the stick's up/down is moved to an axis it lacks
# Buttons 3 and 4 must not reach the game as its own buttons: the Crazy Taxi board had
# none, and the game locks up the moment it sees one (button 4 froze it mid-drive). So the
# game's buttons 3 and 4 (RetroArch Y and X) are moved to a button the panel does not have.
input_player1_l_x_minus_axis = "-0"
input_player1_l_x_plus_axis = "+0"
input_player1_r2_btn = "0"
input_player1_l2_btn = "1"
input_player2_l_x_minus_axis = "-0"
input_player2_l_x_plus_axis = "+0"
input_player2_r2_btn = "0"
input_player2_l2_btn = "1"
input_player1_up_btn = "2"
input_player1_down_btn = "3"
input_player1_y_btn = "15"
input_player1_x_btn = "15"
input_player2_up_btn = "2"
input_player2_down_btn = "3"
input_player2_y_btn = "15"
input_player2_x_btn = "15"
input_player1_up_axis = "-7"
input_player1_down_axis = "+7"
input_player2_up_axis = "-7"
input_player2_down_axis = "+7"
