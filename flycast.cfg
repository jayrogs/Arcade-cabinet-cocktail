# Flycast (Dreamcast and NAOMI) on this Pi.
# The core is built from source for OpenGL ES, the Pi 4's mature graphics driver: the Vulkan
# one made the on-screen display flicker every other frame (tools/flycast_build.sh).
# Sound goes through ALSA into PipeWire (package pipewire-alsa) with audio sync OFF. With
# Flycast's threaded rendering (what makes it smooth), a sound output that waits for room
# locked the game at startup: RetroArch waited on the sound device while the emulator
# waited on RetroArch to draw (seen in a gdb trace). Dropping sound instead of waiting
# fixed it: 6 of 6 clean starts, against most freezing before.
audio_driver = "alsa"
audio_device = "pipewire"
audio_sync = "false"
