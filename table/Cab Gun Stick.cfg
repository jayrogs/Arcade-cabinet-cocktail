# tools/gunstick.py's pretend controller (NAOMI gun games). On the Pi:
# ~/.config/retroarch/autoconfig/udev/Cab Gun Stick.cfg. The buttons are the panel's own,
# passed through; the stick is analog only (it is the crosshair), never up/down/left/right.
input_driver = "udev"
input_device = "Cab Gun Stick"
input_vendor_id = "5824"
input_product_id = "30185"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_start_btn = "7"
input_select_btn = "9"
