# Every game on the Dreamcast shelf (RetroArch reads this for content in roms/dreamcast).
# Dreamcast games mix their sound far louder than the old arcade boards, and with the
# cabinet's sound boosted to 180% (to bury the USB-C adapter's buzz) Crazy Taxi 2 clipped
# on 1.5% of its samples: harsh, distorted sound. With the bass filter (CabClear.dsp, set in
# flycast.cfg) its peaks moved, and 8 dB down keeps them clear of the limit.
audio_volume = "-8.0"
